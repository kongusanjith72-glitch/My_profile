<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="ksGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="ksBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.3" />
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="#0b0f19" />
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#ksGradient)" fill-opacity="0.18" />
  <rect x="5" y="5" width="118" height="118" rx="29" fill="none" stroke="url(#ksBorder)" stroke-width="3" />
  
  <!-- Stylized KS Lettermark -->
  <g fill="url(#ksGradient)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" letter-spacing="-1">
    <text x="64" y="82" text-anchor="middle" fill="url(#ksGradient)">KS</text>
  </g>
</svg>
